services:
  db:
    image: paradedb/paradedb:v0.25.6-pg15
    container_name: jobpilot_db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      PDB_TUNE: ${PDB_TUNE:-false}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    shm_size: 512mb
    volumes:
      # PostgreSQL's default init glob is lexical (V10 would run before V1).
      # ParadeDB bootstraps extensions at 10_*, then this runner applies the
      # application migrations with version-aware ordering.
      - ./backend/src/main/resources/db/migration:/opt/jobpilot/migrations:ro
      - ./backend/docker/init-db.sh:/docker-entrypoint-initdb.d/20-jobpilot-migrations.sh:ro
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-jobpilot_paradedb_data}
