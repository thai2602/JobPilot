spring.application.name=backend
# Load a local .env as a Java properties file. The first path works when the
# process starts in backend/; the second works when it starts at repository root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=8080

# Cấu hình PostgreSQL Database (Cập nhật Username/Password/DB name thực tế sau)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema hiện được quản lý bằng migration SQL. Mặc định không cho Hibernate tự
# thêm lại các cột legacy vào bảng crawler; có thể override qua biến môi trường.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cấu hình JWT
# secret-key tối thiểu 256bit
jwt.secret-key=${JWT_SECRET_KEY:VUI_LONG_NHAP_CHUOIBIMATQUANTRONG_KHONGCHIASE}
jwt.expiration=604800000


# Google Sign-In (Web client ID from Google Cloud Console)
google.client-id=${GOOGLE_CLIENT_ID:866359123309-qpb7ibhpmnhoq2ukvbb0uh7mi9o7nsfp.apps.googleusercontent.com}

# LangChain4j / RAG Config

# -- Cấu hình Chat Model (Sử dụng OpenRouter cho Chatbot & CV Analysis) --
langchain.chat.base-url=https://openrouter.ai/api/v1
langchain.chat.api-key=${OPENAI_API_KEY}
langchain.chat.model-name=google/gemma-3-12b-it

# -- Cấu hình Embedding Model (Sử dụng OpenRouter cho Embeddings) --
langchain.embedding.base-url=https://openrouter.ai/api/v1
langchain.embedding.api-key=${OPENAI_API_KEY}
langchain.embedding.model-name=openai/text-embedding-3-small
langchain.dimension=1536

rag.data.path=src/main/resources/rag-data

# PostgreSQL/pgvector cho hai kho RAG. Với DB từ xa, đặt PGVECTOR_* cùng endpoint
# với SPRING_DATASOURCE_* (LangChain4j 0.29.1 chưa nhận javax.sql.DataSource).
rag.pgvector.host=${PGVECTOR_HOST:localhost}
rag.pgvector.port=${PGVECTOR_PORT:5432}
rag.pgvector.database=${PGVECTOR_DATABASE:jobpilot}
rag.pgvector.username=${PGVECTOR_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
rag.pgvector.password=${PGVECTOR_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123456}}
rag.pgvector.hr-table=${PGVECTOR_HR_TABLE:rag_hr_embeddings}
rag.pgvector.job-table=${PGVECTOR_JOB_TABLE:rag_job_embeddings}
rag.pgvector.historical-job-table=${PGVECTOR_HISTORICAL_JOB_TABLE:rag_historical_job_embeddings}
# Legacy JSON import chỉ còn áp dụng cho HR store; Job store luôn đọc public.jobs.
rag.pgvector.legacy-import=${RAG_IMPORT_LEGACY_JSON:false}

# Retrieval: vector + PostgreSQL FTS -> weighted RRF -> local reranker -> router.
rag.retrieval.hr.max-candidates=${RAG_HR_MAX_CANDIDATES:24}
rag.retrieval.hr.min-score=${RAG_HR_MIN_SCORE:0.60}
rag.retrieval.hr.max-reranked=${RAG_HR_MAX_RERANKED:8}
rag.retrieval.job.max-candidates=${RAG_JOB_MAX_CANDIDATES:18}
rag.retrieval.job.min-score=${RAG_JOB_MIN_SCORE:0.55}
rag.retrieval.job.max-reranked=${RAG_JOB_MAX_RERANKED:6}
rag.retrieval.historical.max-candidates=${RAG_HISTORICAL_MAX_CANDIDATES:24}
rag.retrieval.historical.min-score=${RAG_HISTORICAL_MIN_SCORE:0.50}
rag.retrieval.historical.max-reranked=${RAG_HISTORICAL_MAX_RERANKED:8}
rag.retrieval.hybrid.enabled=${RAG_HYBRID_ENABLED:true}
rag.retrieval.hybrid.lexical-max-candidates=${RAG_HYBRID_LEXICAL_MAX_CANDIDATES:24}
rag.retrieval.hybrid.rrf-k=${RAG_HYBRID_RRF_K:60}
rag.retrieval.hybrid.vector-weight=${RAG_HYBRID_VECTOR_WEIGHT:1.0}
rag.retrieval.hybrid.lexical-weight=${RAG_HYBRID_LEXICAL_WEIGHT:1.2}
rag.retrieval.router.score-margin=${RAG_ROUTER_SCORE_MARGIN:1}
rag.retrieval.router.merged-max-results=${RAG_MERGED_MAX_RESULTS:10}
rag.retrieval.reranker.enabled=${RAG_RERANKER_ENABLED:true}
rag.retrieval.reranker.url=${RAG_RERANKER_URL:http://localhost:8000/rerank}
rag.retrieval.reranker.connect-timeout-ms=${RAG_RERANKER_CONNECT_TIMEOUT_MS:1500}
rag.retrieval.reranker.read-timeout-ms=${RAG_RERANKER_READ_TIMEOUT_MS:2500}

# Pipeline dữ liệu: crawler.* (raw) -> public.* (canonical) -> incremental RAG.
crawler.pipeline.enabled=${CRAWLER_PIPELINE_ENABLED:false}
crawler.pipeline.run-on-start=${CRAWLER_PIPELINE_RUN_ON_START:false}
crawler.pipeline.cron=${CRAWLER_PIPELINE_CRON:0 */15 * * * *}
crawler.pipeline.sync-rag=${CRAWLER_PIPELINE_SYNC_RAG:true}
crawler.source-schema=${CRAWLER_SOURCE_SCHEMA:crawler}
crawler.company-table=${CRAWLER_COMPANY_TABLE:companies}
crawler.job-table=${CRAWLER_JOB_TABLE:jobs}
crawler.default-source=${CRAWLER_DEFAULT_SOURCE:crawler}

# Job RAG chỉ đọc dữ liệu canonical trong public. Có thể chạy độc lập lúc startup;
# nếu bật crawler pipeline thì pipeline sẽ normalize trước khi gọi sync lần kế tiếp.
rag.incremental.enabled=${RAG_INCREMENTAL_ENABLED:false}
rag.incremental.run-on-start=${RAG_INCREMENTAL_RUN_ON_START:false}
rag.incremental.batch-size=${RAG_INCREMENTAL_BATCH_SIZE:64}
rag.incremental.delete-stale=${RAG_INCREMENTAL_DELETE_STALE:true}
rag.incremental.allow-empty-source=${RAG_INCREMENTAL_ALLOW_EMPTY_SOURCE:false}
rag.incremental.source-schema=${RAG_INCREMENTAL_SOURCE_SCHEMA:public}
rag.incremental.job-table=${RAG_INCREMENTAL_JOB_TABLE:jobs}
rag.incremental.company-table=${RAG_INCREMENTAL_COMPANY_TABLE:companies}

# Historical Job Store: CLOSED/hết hạn, dùng cho phân tích thị trường.
rag.historical.enabled=${RAG_HISTORICAL_ENABLED:false}
rag.historical.run-on-start=${RAG_HISTORICAL_RUN_ON_START:false}
rag.historical.batch-size=${RAG_HISTORICAL_BATCH_SIZE:64}
rag.historical.delete-stale=${RAG_HISTORICAL_DELETE_STALE:true}
rag.historical.allow-empty-source=${RAG_HISTORICAL_ALLOW_EMPTY_SOURCE:false}
rag.historical.source-schema=${RAG_INCREMENTAL_SOURCE_SCHEMA:public}
rag.historical.job-table=${RAG_INCREMENTAL_JOB_TABLE:jobs}
rag.historical.company-table=${RAG_INCREMENTAL_COMPANY_TABLE:companies}


# ── Debug RAG retrieval ──────────────────────────────────────────────────────
# Bật để xem các đoạn tài liệu nào được retrieve và inject vào prompt mỗi lần chat
# Tắt lại (INFO) khi không cần debug nữa để giảm noise
# xóa khi log quá nhiều
logging.level.dev.langchain4j=DEBUG
logging.level.dev.langchain4j.rag=DEBUG
logging.level.com.jobportal=DEBUG 

